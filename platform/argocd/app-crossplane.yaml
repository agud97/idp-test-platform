apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    idp.platform.io/environment: shared
    idp.platform.io/team: platform
spec:
  project: default
  sources:
    - repoURL: https://charts.crossplane.io/stable
      chart: crossplane
      targetRevision: 1.14.x
    - repoURL: https://github.com/agud97/idp-test-platform.git
      targetRevision: feature/phase-1-foundation
      path: platform/crds
      directory:
        recurse: true
    - repoURL: https://github.com/agud97/idp-test-platform.git
      targetRevision: feature/phase-1-foundation
      path: platform/crossplane
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
