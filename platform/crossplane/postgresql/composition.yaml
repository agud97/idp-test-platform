apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresql-composition
  labels:
    app.kubernetes.io/managed-by: crossplane
    idp.platform.io/environment: shared
    idp.platform.io/team: platform
spec:
  compositeTypeRef:
    apiVersion: database.idp.platform.io/v1alpha1
    kind: XPostgresqlInstance
  mode: Pipeline
  pipeline:
    - step: render-postgresql
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $spec := $xr.spec -}}
            {{- if $spec.enabled }}
            {{- $componentName := $spec.componentName -}}
            {{- $namespace := $spec.namespace -}}
            {{- $environmentName := default $namespace $spec.environmentName -}}
            {{- $team := default "platform" $spec.team -}}
            {{- $port := default 5432 $spec.port -}}
            {{- $storageSize := default "8Gi" $spec.storageSize -}}
            {{- $storageClassName := "" -}}
            {{- if hasKey $spec "storageClassName" }}{{- $storageClassName = $spec.storageClassName -}}{{- end -}}
            {{- $imageRegistry := "docker.io" -}}
            {{- $imageTag := default "16" $spec.imageTag -}}
            {{- $secretName := printf "%s-db-credentials" $componentName -}}
            {{- $username := $componentName -}}
            {{- $password := printf "%s-%s-password" $environmentName $componentName -}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "credentials-secret" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: postgresql
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  type: Opaque
                  data:
                    username: {{ $username | b64enc }}
                    password: {{ $password | b64enc }}
                    database: {{ $componentName | b64enc }}
                    host: {{ $componentName | b64enc }}
                    port: {{ printf "%v" $port | b64enc }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "service" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $componentName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: postgresql
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  spec:
                    selector:
                      app.kubernetes.io/name: postgresql
                      app.kubernetes.io/instance: {{ $componentName }}
                    ports:
                      - name: postgresql
                        port: {{ $port }}
                        targetPort: {{ $port }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "persistent-volume-claim" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata:
                    name: {{ printf "%s-data" $componentName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: postgresql
                      app.kubernetes.io/instance: {{ $componentName }}
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  spec:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: {{ $storageSize }}
                    {{- if $storageClassName }}
                    storageClassName: {{ $storageClassName }}
                    {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "deployment" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: {{ $componentName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: postgresql
                      app.kubernetes.io/instance: {{ $componentName }}
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: postgresql
                        app.kubernetes.io/instance: {{ $componentName }}
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: postgresql
                          app.kubernetes.io/instance: {{ $componentName }}
                          idp.platform.io/environment: {{ $environmentName }}
                          idp.platform.io/team: {{ $team }}
                      spec:
                        containers:
                          - name: postgresql
                            image: {{ printf "%s/bitnamilegacy/postgresql:%s" $imageRegistry $imageTag }}
                            imagePullPolicy: IfNotPresent
                            ports:
                              - containerPort: {{ $port }}
                                name: postgresql
                            env:
                              - name: POSTGRESQL_DATABASE
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: database
                              - name: POSTGRESQL_USERNAME
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: username
                              - name: POSTGRESQL_PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: password
                            volumeMounts:
                              - name: data
                                mountPath: /bitnami/postgresql
                        volumes:
                          - name: data
                            persistentVolumeClaim:
                              claimName: {{ printf "%s-data" $componentName }}
            ---
            apiVersion: database.idp.platform.io/v1alpha1
            kind: XPostgresqlInstance
            status:
              ready: true
              serviceName: {{ $componentName }}
            {{- end }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
