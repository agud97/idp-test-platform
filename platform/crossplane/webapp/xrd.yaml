apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xwebappinstances.app.idp.platform.io
  labels:
    app.kubernetes.io/managed-by: crossplane
    idp.platform.io/environment: shared
    idp.platform.io/team: platform
spec:
  group: app.idp.platform.io
  names:
    kind: XWebappInstance
    plural: xwebappinstances
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - componentName
                - namespace
                - enabled
              properties:
                componentName:
                  type: string
                  minLength: 1
                  maxLength: 63
                namespace:
                  type: string
                  minLength: 1
                  maxLength: 63
                environmentName:
                  type: string
                  minLength: 1
                  maxLength: 63
                team:
                  type: string
                  minLength: 1
                  maxLength: 64
                enabled:
                  type: boolean
                imageRepository:
                  type: string
                  minLength: 1
                  maxLength: 255
                imageTag:
                  type: string
                  maxLength: 128
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 50
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 8080
                configOverrides:
                  type: object
                  maxProperties: 64
                  additionalProperties:
                    type: string
                    maxLength: 2048
                database:
                  type: object
                  properties:
                    engine:
                      type: string
                      enum:
                        - postgresql
                        - redis
                    imageTag:
                      type: string
                      maxLength: 128
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                  required:
                    - engine
            status:
              type: object
              properties:
                ready:
                  type: boolean
                serviceName:
                  type: string
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Service
          type: string
          jsonPath: .status.serviceName
