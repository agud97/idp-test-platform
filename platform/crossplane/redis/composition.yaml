apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: redis-composition
  labels:
    app.kubernetes.io/managed-by: crossplane
    idp.platform.io/environment: shared
    idp.platform.io/team: platform
spec:
  compositeTypeRef:
    apiVersion: database.idp.platform.io/v1alpha1
    kind: XRedisInstance
  mode: Pipeline
  pipeline:
    - step: render-redis
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $spec := $xr.spec -}}
            {{- if $spec.enabled }}
            {{- $componentName := $spec.componentName -}}
            {{- $namespace := $spec.namespace -}}
            {{- $environmentName := default $namespace $spec.environmentName -}}
            {{- $team := default "platform" $spec.team -}}
            {{- $port := default 6379 $spec.port -}}
            {{- $imageRegistry := "docker.io" -}}
            {{- $imageTag := default "8.2.1-debian-12-r0" $spec.imageTag -}}
            {{- $secretName := printf "%s-db-credentials" $componentName -}}
            {{- $password := printf "%s-%s-password" $environmentName $componentName -}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "credentials-secret" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: redis
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  type: Opaque
                  data:
                    password: {{ $password | b64enc }}
                    host: {{ $componentName | b64enc }}
                    port: {{ printf "%v" $port | b64enc }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "service" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $componentName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: redis
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  spec:
                    selector:
                      app.kubernetes.io/name: redis
                      app.kubernetes.io/instance: {{ $componentName }}
                    ports:
                      - name: redis
                        port: {{ $port }}
                        targetPort: {{ $port }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "deployment" }}
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/managed-by: crossplane
                idp.platform.io/environment: {{ $environmentName }}
                idp.platform.io/team: {{ $team }}
            spec:
              deletionPolicy: Delete
              providerConfigRef:
                name: kubernetes-provider
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: {{ $componentName }}
                    namespace: {{ $namespace }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      app.kubernetes.io/name: redis
                      app.kubernetes.io/instance: {{ $componentName }}
                      idp.platform.io/environment: {{ $environmentName }}
                      idp.platform.io/team: {{ $team }}
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: redis
                        app.kubernetes.io/instance: {{ $componentName }}
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: redis
                          app.kubernetes.io/instance: {{ $componentName }}
                          idp.platform.io/environment: {{ $environmentName }}
                          idp.platform.io/team: {{ $team }}
                      spec:
                        containers:
                          - name: redis
                            image: {{ printf "%s/bitnamilegacy/redis:%s" $imageRegistry $imageTag }}
                            imagePullPolicy: IfNotPresent
                            args:
                              - --requirepass
                              - $(REDIS_PASSWORD)
                            ports:
                              - containerPort: {{ $port }}
                                name: redis
                            env:
                              - name: REDIS_PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: password
            ---
            apiVersion: database.idp.platform.io/v1alpha1
            kind: XRedisInstance
            status:
              ready: true
              serviceName: {{ $componentName }}
            {{- end }}
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
