backstage:
  image:
    registry: ghcr.io
    repository: agud97/idp-test-platform/backstage-oidc
    tag: phase-4-task-4-1-r2
    pullSecrets:
      - ghcr-pull
  appConfig:
    app:
      title: IDP Platform
      baseUrl: http://localhost:7007
    backend:
      baseUrl: http://localhost:7007
  command:
    - /bin/sh
    - -ec
  args:
    - |
      mkdir -p /tmp/catalog
      printf '%s\n' "$ALL_COMPONENTS_YAML" > /tmp/catalog/all-components.yaml
      exec node packages/backend \
        --config app-config.yaml \
        --config app-config.production.yaml \
        --config /app/app-config-from-configmap.yaml
