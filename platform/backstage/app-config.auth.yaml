backstage:
  extraEnvVarsSecrets:
    - backstage-secrets
  appConfig:
    auth:
      environment: production
      providers:
        oidc:
          production:
            metadataUrl: http://authentik-server.authentik.svc.cluster.local/application/o/backstage/.well-known/openid-configuration
            clientId: backstage
            clientSecret: ${OAUTH_CLIENT_SECRET}
            prompt: login
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
    backend:
      auth:
        keys:
          - secret: ${BACKSTAGE_BACKEND_AUTH_SECRET}
    signInPage: oidc
    catalog:
      rules:
        - allow:
            - Component
            - Resource
            - System
            - API
            - Location
            - Template
            - User
            - Group
    permission:
      enabled: true
