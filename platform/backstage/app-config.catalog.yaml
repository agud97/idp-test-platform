backstage:
  appConfig:
    backend:
      reading:
        allow:
          - host: github.com
          - host: raw.githubusercontent.com
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    catalog:
      locations:
        - type: url
          target: https://raw.githubusercontent.com/agud97/idp-test-platform/a85860575eddb4bc59e8d4087bd8d7b1aaef2a08/catalog/all-components.yaml
          rules:
            - allow:
                - Component
                - System
                - Group
