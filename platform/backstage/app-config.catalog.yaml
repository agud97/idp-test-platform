backstage:
  appConfig:
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    backend:
      reading:
        allow:
          - host: raw.githubusercontent.com
    catalog:
      locations:
        - type: url
          target: https://github.com/agud97/idp-test-platform/blob/feature/phase-1-foundation/catalog/all-components.yaml
          rules:
            - allow:
                - Component
                - System
                - Group
