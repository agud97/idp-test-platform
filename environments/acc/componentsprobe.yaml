apiVersion: idp.platform.io/v1alpha1
kind: Environment
metadata:
  name: componentsprobe
spec:
  owner: group:default/platform
  team: acc
  components:
    - name: web
      type: webapp
      enabled: true
      replicas: 3
      imageRepository: docker.io/library/nginx
      imageTag: 1.27.4
    - name: database
      type: postgresql
      enabled: true
