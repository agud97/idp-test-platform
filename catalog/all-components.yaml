apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-portal
  description: IDP Backstage portal deployed in the shared platform namespace.
  annotations:
    backstage.io/kubernetes-cluster: primary
    backstage.io/kubernetes-namespace: backstage
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=backstage
spec:
  type: service
  lifecycle: production
  owner: platform
  system: idp-platform
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: idp-platform
  description: Shared control-plane services for the IDP test environment platform.
spec:
  owner: platform
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  description: Platform engineering team.
spec:
  type: team
  profile:
    displayName: Platform Engineering
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: new-environment-template
  description: Registers the self-service Backstage template for new IDP environments.
spec:
  type: url
  target: https://github.com/agud97/idp-test-platform/blob/89e4e3ade4388b014820b073a04ac43342d3ef70/templates/new-environment/template.yaml
