# Source: Backstage Scaffolder
apiVersion: idp.platform.io/v1alpha1
kind: Environment
metadata:
  name: ${{ values.env_name }}
spec:
  owner: ${{ values.owner }}
  team: ${{ values.team }}
  components:
    - name: web
      type: webapp
      enabled: ${{ values.webapp_enabled }}
      imageTag: ${{ values.webapp_image_tag }}
      replicas: ${{ values.webapp_replicas }}
    - name: database
      type: postgresql
      enabled: ${{ values.postgresql_enabled }}
    - name: cache
      type: redis
      enabled: ${{ values.redis_enabled }}
      replicas: ${{ values.redis_replicas }}
    {% if values.account_api_enabled %}
    - name: account-api
      type: webapp
      enabled: ${{ values.account_api_enabled }}
      imageTag: ${{ values.account_api_image_tag }}
      replicas: ${{ values.account_api_replicas }}
      configOverrides:
        APP_DB_NAME: ${{ values.account_api_app_db_name }}
        APP_DB_USER: ${{ values.account_api_app_db_user }}
        CONFIG_MODE: ${{ values.account_api_config_mode }}
        DB_HOSTNAME: ${{ values.account_api_db_hostname }}
        DB_USERNAME: ${{ values.account_api_db_username }}
        OUT_PATH_CONF: ${{ values.account_api_out_path_conf }}
        PATH_TO_CONF: ${{ values.account_api_path_to_conf }}
        PROMETHEUS_MULTIPROC_DIR: ${{ values.account_api_prometheus_multiproc_dir }}
        PUBLIC_HOST: ${{ values.account_api_public_host }}
        REGRU_MODE: ${{ values.account_api_regru_mode }}
    {% endif %}
