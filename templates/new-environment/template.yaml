apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-environment
  title: New Environment
  description: Create a new IDP test environment and register it in the Backstage catalog.
  tags:
    - environment
    - gitops
    - idp
spec:
  owner: group:default/platform
  type: service
  parameters:
    - title: Environment Details
      required:
        - environment_name
        - team
        - owner
      properties:
        environment_name:
          title: Environment Name
          type: string
          description: Lowercase slug used for the GitOps manifest and namespace suffix.
          pattern: '^[a-z0-9-]{1,40}$'
        team:
          title: Team
          type: string
          description: Team slug used for the manifest path under environments/<team>/.
          pattern: '^[a-z0-9-]{1,20}$'
        owner:
          title: Owner Entity Ref
          type: string
          description: Backstage entity ref such as user:default/dev-alice or group:default/platform.
          default: group:default/platform
    - title: Service Selection
      properties:
        webapp_enabled:
          title: Enable Webapp
          type: boolean
          default: true
        postgresql_enabled:
          title: Enable PostgreSQL
          type: boolean
          default: true
        redis_enabled:
          title: Enable Redis
          type: boolean
          default: false
        account_api_enabled:
          title: Enable account-api
          type: boolean
          default: false
      dependencies:
        webapp_enabled:
          oneOf:
            - properties:
                webapp_enabled:
                  const: false
            - properties:
                webapp_enabled:
                  const: true
                webapp_image_tag:
                  title: Webapp Image Tag
                  type: string
                  default: latest
                webapp_replicas:
                  title: Webapp Replicas
                  type: integer
                  minimum: 0
                  maximum: 50
                  default: 1
        redis_enabled:
          oneOf:
            - properties:
                redis_enabled:
                  const: false
            - properties:
                redis_enabled:
                  const: true
                redis_replicas:
                  title: Redis Replicas
                  type: integer
                  minimum: 0
                  maximum: 50
                  default: 1
        account_api_enabled:
          oneOf:
            - properties:
                account_api_enabled:
                  const: false
            - properties:
                account_api_enabled:
                  const: true
                account_api_image_tag:
                  title: account-api Image Tag
                  type: string
                  default: latest
                account_api_replicas:
                  title: account-api Replicas
                  type: integer
                  minimum: 0
                  maximum: 50
                  default: 1
                account_api_app_db_name:
                  title: account-api APP_DB_NAME
                  type: string
                  default: account
                account_api_app_db_user:
                  title: account-api APP_DB_USER
                  type: string
                  default: account_user
                account_api_config_mode:
                  title: account-api CONFIG_MODE
                  type: string
                  default: develop
                account_api_db_hostname:
                  title: account-api DB_HOSTNAME
                  type: string
                  default: database
                account_api_db_username:
                  title: account-api DB_USERNAME
                  type: string
                  default: root
                account_api_out_path_conf:
                  title: account-api OUT_PATH_CONF
                  type: string
                  default: /tmp/configs
                account_api_path_to_conf:
                  title: account-api PATH_TO_CONF
                  type: string
                  default: src/configs
                account_api_prometheus_multiproc_dir:
                  title: account-api PROMETHEUS_MULTIPROC_DIR
                  type: string
                  default: /tmp/metrics
                account_api_public_host:
                  title: account-api PUBLIC_HOST
                  type: string
                  default: http://public-cfg:5000
                account_api_regru_mode:
                  title: account-api REGRU_MODE
                  type: string
                  default: develop
  steps:
    - id: render-environment
      name: Render environment manifest
      action: fetch:template:file
      input:
        url: ./skeleton/environment.yaml
        targetPath: ./environments/${{ parameters.team }}/${{ parameters.environment_name }}.yaml
        values:
          env_name: ${{ parameters.environment_name }}
          environment_name: ${{ parameters.environment_name }}
          team: ${{ parameters.team }}
          owner: ${{ parameters.owner }}
          webapp_enabled: ${{ parameters.webapp_enabled }}
          webapp_image_tag: ${{ parameters.webapp_image_tag }}
          webapp_replicas: ${{ parameters.webapp_replicas }}
          postgresql_enabled: ${{ parameters.postgresql_enabled }}
          redis_enabled: ${{ parameters.redis_enabled }}
          redis_replicas: ${{ parameters.redis_replicas }}
          account_api_enabled: ${{ parameters.account_api_enabled }}
          account_api_image_tag: ${{ parameters.account_api_image_tag }}
          account_api_replicas: ${{ parameters.account_api_replicas }}
          account_api_app_db_name: ${{ parameters.account_api_app_db_name }}
          account_api_app_db_user: ${{ parameters.account_api_app_db_user }}
          account_api_config_mode: ${{ parameters.account_api_config_mode }}
          account_api_db_hostname: ${{ parameters.account_api_db_hostname }}
          account_api_db_username: ${{ parameters.account_api_db_username }}
          account_api_out_path_conf: ${{ parameters.account_api_out_path_conf }}
          account_api_path_to_conf: ${{ parameters.account_api_path_to_conf }}
          account_api_prometheus_multiproc_dir: ${{ parameters.account_api_prometheus_multiproc_dir }}
          account_api_public_host: ${{ parameters.account_api_public_host }}
          account_api_regru_mode: ${{ parameters.account_api_regru_mode }}
    - id: render-catalog
      name: Render catalog entry
      action: fetch:template:file
      input:
        url: ./skeleton/catalog-info.yaml
        targetPath: ./catalog/environments/${{ parameters.team }}-${{ parameters.environment_name }}.yaml
        values:
          env_name: ${{ parameters.environment_name }}
          environment_name: ${{ parameters.environment_name }}
          team: ${{ parameters.team }}
          owner: ${{ parameters.owner }}
    - id: publish
      name: Commit files to the GitOps repository
      action: github:repo:upsert
      input:
        repoUrl: github.com?owner=agud97&repo=idp-test-platform
        branch: feature/phase-1-foundation
        sourcePath: .
        gitCommitMessage: Create environment ${{ parameters.team }}/${{ parameters.environment_name }}
        gitAuthorName: Backstage Scaffolder
        gitAuthorEmail: backstage@idp.platform.io
    - id: register
      name: Register catalog entry
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/agud97/idp-test-platform/blob/${{ steps.publish.output.commitHash }}/catalog/environments/${{ parameters.team }}-${{ parameters.environment_name }}.yaml
  output:
    links:
      - title: Git commit
        url: https://github.com/agud97/idp-test-platform/commit/${{ steps.publish.output.commitHash }}
      - title: Catalog entity
        entityRef: ${{ steps.register.output.entityRef }}
