name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache-dependency-path: cli/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

  crd-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci-crd-validate

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.3

      - name: Validate CRDs
        run: kubectl apply --dry-run=client -f platform/crds/

  composition-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect compositions
        id: compositions
        shell: bash
        run: |
          if find platform/crossplane -name '*.yaml' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Crossplane CLI
        if: steps.compositions.outputs.present == 'true'
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Validate compositions
        if: steps.compositions.outputs.present == 'true'
        run: crossplane beta validate platform/crossplane/...

      - name: Skip empty crossplane tree
        if: steps.compositions.outputs.present != 'true'
        run: echo "No Crossplane compositions present yet; skipping validation."

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubescape
        run: |
          curl -fsSL https://github.com/kubescape/kubescape/releases/download/v4.0.2/kubescape_4.0.2_linux_amd64 -o kubescape
          chmod +x kubescape
          sudo mv kubescape /usr/local/bin/kubescape

      - name: Scan platform manifests
        run: kubescape scan platform/ --format json --output kubescape-platform.json

      - name: Fail on CRITICAL findings
        run: |
          python3 - <<'PY'
          import json
          import sys

          files = ["kubescape-platform.json"]
          failures = []
          for path in files:
              with open(path) as fh:
                  data = json.load(fh)
              summary = data.get("summaryDetails", {})
              resource_critical = summary.get("resourcesSeverityCounters", {}).get("criticalSeverity", 0)
              control_critical = summary.get("controlsSeverityCounters", {}).get("criticalSeverity", 0)
              if resource_critical or control_critical:
                  failures.append(f"{path}: resources={resource_critical} controls={control_critical}")
          if failures:
              print("CRITICAL findings detected:")
              for failure in failures:
                  print(failure)
              sys.exit(1)
          print("Kubescape scan passed with zero CRITICAL findings.")
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"

      - name: Run security tests
        run: go test ./tests/security/... -v
