services:
  api:
    image: ghcr.io/example/api:v1.4.2
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_NAME: app
      DB_USER: appuser
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme

